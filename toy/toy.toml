# Painting toy (toy/painting_toy.py): pictures, rules, speed, rewind and GIF export.

[window]
width = 1340
height = 860
canvas = 880              # width of the picture area (left); the panel takes the rest
fps = 60

[sim]
cells = 17000             # cells of a picture (about); the grid follows its aspect ratio
aspect = 1.3333           # width / height of every picture (4:3): paintings are cut to it
colours = 5               # number of colours of every picture (Chris, 2026-11-20)
smooth = 0.5              # blur before quantising a painting, in cell widths
seed = 1
speed = 1.0               # sim time units per wall second
fast = 16.0               # same with fast-forward on
frame_budget_ms = 30.0
chunk_attempts = 2048
max_reactions = 48        # the reaction list holds at most this many (all k = 1)

[rewind]
t0 = 0.02                 # first recorded sim time; then nearly geometric spacing ...
ratio = 1.02              # ... next frame at t * ratio ...
max_dt = 0.5              # ... never more than this apart
max_frames = 2000         # beyond this every other frame is dropped
duration_s = 12.0         # in-app rewind length
pacing = "change"         # "change": equal steps of change; "linear": equal steps of time

[gif]
folder = "gifs"           # under the repository root (git-ignored)
frames = 150
frame_ms = 60
hold_start_ms = 800       # first frame (the dissolved state)
hold_end_ms = 3000        # last frame (the picture)
hex_px = 3.0              # hex circumradius in the GIF, pixels
pacing = "change"

[palettes]
# One set of colours per picture. A painting: "present" = the most present colours;
# "contrast" and "accent" = the most different colours among the clusters that hold at
# least this share of the picture (toy/pictures.py). A picture entry names its own choice
# with palette = "..." (and, for "contrast", its own share = ...); otherwise the default. Compare the three choices with
# tools/palette_sheet.py or tools/gallery.py.
default = "contrast"
clusters = 20
contrast_share = 0.02
accent_share = 0.004
generated = "eggshell_peach"   # colours of the generated pictures (a palette of toy/viewer.toml)

# ---- pictures, in menu order -----------------------------------------------------------------
# Chris's choice of paintings and colours (2026-11-20: gallery, then the pick page; landscape
# formats only). crop = [left, top, right, bottom] fractions of the scan; anchor = [x, y]
# places the 4:3 window (default centred).
