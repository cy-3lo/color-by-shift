# Parameters for the pygame viewer (toy/viewer.py) and PNG snapshots (tools/science.py).

[window]
width = 1280
height = 1000            # 10 sandbox slots fit; rows shrink if they do not
grid_width = 800          # width of the grid area (left column, full window height)
fps = 60

[speed]
base_time_per_s = 1.0     # x1 = this many sim time units per wall second
multipliers = [0.25, 1, 4, 16]   # keys 1-4
frame_budget_ms = 30.0    # max simulation time per frame (x16 may fall behind)
chunk_attempts = 2048     # attempts between chart samples (partial sweeps)

[lamps]
# meter beside each equation: needle = firing rate per cell per time unit, log scale
tau = 1.0                 # smoothing time of the firing rate (sim time units)
lo = 1e-4                 # rate at the left end of the dial
hi = 1.0                  # rate at the right end of the dial
needle_tau = 0.15         # wall-clock lag of the needle (s), for a smooth swing

[arrows]
style = "width"           # "width": line 1-5 px by k / k_max; "grey": lighter = faster

[sandbox]
colours = 5
slots = 10                # reaction slots (unused ones are off, k = 0)
start_colours = 3         # random start: colours 0 .. n-1 only ("Start" button, --start)
rates = [0, 0.1, 0.2, 0.5, 1, 2, 5, 10]   # values the k button cycles through (0 = off)
grid = { type = "hexagon", side = 74 }
reactions = [
  { shape = "edge", in = [0, 1], out = [0, 0], rate = 1.0 },
  { shape = "edge", in = [1, 2], out = [1, 1], rate = 1.0 },
  { shape = "edge", in = [2, 0], out = [2, 2], rate = 1.0 },
  { shape = "cell", in = [3], out = [4], rate = 0.0 },
]

[rewind]
# the run is recorded (colour arrays) so that Rewind (button or key B) plays it backwards
t0 = 0.02                 # first recorded sim time; then nearly geometric spacing ...
ratio = 1.02              # ... next frame at t * ratio ...
max_dt = 0.5              # ... but never more than this apart (sim time units)
max_frames = 2000         # beyond this, every other frame is dropped
duration_s = 12.0         # length of the rewind (wall seconds)
pacing = "change"         # "change": equal steps of change; "linear": equal steps of sim time

[chart]
window = 60.0             # sim time units shown
height = 220
size_height = 110         # patch-size chart (log scale) under the fractions chart

[terrain]
fixed_dot = 0.45          # fixed-cell marker: inner hexagon, fraction of the cell
wall_tones = ["chart", "btn"]   # walls hatched in these two interface tones
wall_stripe_px = 3        # width of the hatching stripes
brush_radii = [0, 1, 2, 4]      # Brush button cycles through these (cells)

[grid]
border = 0.0              # dark gap between hexes, fraction of the inradius (0 = none)
zoom_step = 1.25          # mouse wheel or +/- keys; drag the grid to pan; 0 resets
max_cell_px = 40.0        # largest hex circumradius when zoomed in

[palette]
default = "eggshell_peach"        # one of the [palettes] below; switch live from the viewer menu
menu = ["eggshell_peach", "dusk_coral", "grape_sunflower", "teal_coral", "candy"]   # others: --palette NAME
show_glyphs = false       # symbols on the equation blocks (toggle in the viewer)
glyphs = ["circle", "triangle", "square", "diamond", "cross", "ring", "bar", "x"]
background = "#1E1E24"   # only used where no palette applies
chart_lightness = 0.5     # chart background: grey of this HLS lightness ...
chart_tint = 0.25         # ... with the darkest colour's hue at this fraction of its saturation
# for these long palettes a level with n colours uses the n best-separated ones (largest
# smallest pairwise Delta E, normal vision; ties broken by deuteranopia, then protanopia).
# Every palette themes the interface: darkest colour = background, lightest = text.
best_subset = ["strawberry_slate", "jasmine_sage", "olive_almond", "charcoal_brick", "dusk_coral", "neon_turquoise"]

