# Foam toy (toy/foam_toy.py): click to shift, levels in levels/foam (tools/make_foam.py).

[window]
width = 1160
height = 760
strip = 150               # width of the strip (right); the picture takes the rest
margin = 24               # around the picture, pixels
fps = 60

[levels]
folder = "levels/foam"

[picture]
outline_px = 0            # outline of the shapes while playing (0 = none)
win_outline_px = 3        # outline of the shapes once the picture is recovered (0 = none)
cell_lines = true         # thin line between every two cells
show_target = false       # small coloured copy of the picture to recover in the strip

[reward]
lines_s = 0.8             # the lines between cells fade out
hold_s = 1.0              # the flat shapes stay
fade_s = 2.5              # then the painting fades in (painting levels)
