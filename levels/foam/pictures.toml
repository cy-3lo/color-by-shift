# Pictures of the foam levels (tools/make_foam.py builds grids/foam_<id>.json and
# levels/foam/<id>.json from this file). The box is [0, 1.5] x [0, 1], y down.
# shapes: later ones are drawn on top. Kinds:
#   {regular = sides, at = [x, y], r = radius, rot = degrees}   regular polygon (rot = angle of
#                                                               its first corner, -90 = up)
#   {star = points, at = [x, y], r = outer radius, inner = inner radius, rot = degrees}
#   {rect = [x0, y0, x1, y1]}
#   {polygon = [[x, y], ...]}
# colours: palette index of the background, then of each shape. moves: length of the scramble.

aspect = 1.5
palette = ["#26466e", "#f0e2c4", "#d6604d", "#6fae8c", "#e9b44c"]

