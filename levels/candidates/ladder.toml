# Candidate levels for the ladder (tools/make_ladder.py): Chris picks 3-4 learning levels and
# 6 paintings from the contact sheets in runs/ladder/.
#
# [[mondrian]]: a generated composition in the manner of Mondrian's grid paintings
# (mosaic_model.mondrian.lined_composition, from `seed`): `rects` rectangles separated by
# black lines, all white except one per colour beyond black and white, on a foam of `cells`
# cells, scrambled by `moves` moves that cannot be undone in fewer.
# [[painting]]: a picture of toy/toy.toml or assets/rawpixel/pictures.toml with its colour
# choice (palette, share) and number of cells (tools/make_painting_level.py).

aspect = 1.3333
min_side = 0.16                     # shortest side of a rectangle (picture height = 1)
bar = 0.03                          # width of the black lines
palette = ["#f1ede2", "#1d1d21", "#d8402f", "#efc23a", "#2a56a5"]   # white, black, red, yellow, blue

