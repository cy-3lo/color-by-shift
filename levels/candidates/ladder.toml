# Candidate levels for the ladder (tools/make_ladder.py): Chris picks 8 learning levels and
# 6 paintings from the contact sheets in runs/ladder/.
#
# [[mondrian]]: a generated composition of `rects` rectangles in `colours` colours
# (mosaic_model.mondrian, from `seed`), on a foam of `cells` cells, scrambled by `moves`
# moves that cannot be undone in fewer.
# [[painting]]: a [[pictures]] entry of toy/toy.toml (tools/make_painting_level.py).

aspect = 1.3333
min_side = 0.16                     # shortest side of a rectangle (picture height = 1)
palette = ["#f1ede2", "#d8402f", "#2a56a5", "#efc23a", "#8d9399"]   # white, red, blue, yellow, grey

